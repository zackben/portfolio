<?xml version="1.0" encoding="UTF-8"?>
<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#168707">
    <g transform="rotate(0 25 25)">
      <ellipse cx="25" cy="25" rx="15" ry="8" stroke-width="2" opacity="0.3"/>
    </g>
    <g transform="rotate(120 25 25)">
      <ellipse cx="25" cy="25" rx="15" ry="8" stroke-width="2" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="25" cy="25" rx="15" ry="8" stroke-width="2" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="5s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <ellipse cx="25" cy="25" rx="15" ry="8" stroke-width="2" opacity="0.7"/>
  </g>
</svg>